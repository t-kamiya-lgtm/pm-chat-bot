<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>チャットボット埋め込みデモ</title>
    <style>
      body {
        margin: 0;
        font-family: sans-serif;
        background: #fafafa;
        color: #171717;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 40px 24px;
      }
      h1 {
        font-size: 20px;
      }
      p {
        line-height: 1.8;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>スマレジEC・リピート ページ再現(デモ)</h1>
      <p>
        このページは、実際のスマレジECサイトに埋め込んだ場合の見え方を確認するためのデモページです。
        右下の「チャットで相談する」ボタンを押すと、ポップアップでチャットボットが開きます。
      </p>
      <p>
        右上の「×」ボタン、またはもう一度ボタンを押すことでポップアップを閉じ、このページに戻ります。
      </p>
    </main>
    <script src="/widget.js"></script>
  </body>
</html>
