<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>チャットボット埋め込みデモ</title>
    <style>
      body {
        margin: 0;
        font-family: sans-serif;
        background: #fafafa;
        color: #171717;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 40px 24px;
      }
      h1 {
        font-size: 20px;
      }
      p {
        line-height: 1.8;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>スマレジEC・リピート ページ再現(デモ)</h1>
      <p>
        このページは、実際のスマレジECサイトに埋め込んだ場合の見え方を確認するためのデモページです。
        右下の「チャットで相談する」ボタンを押すと、ポップアップでチャットボットが開きます。
      </p>
      <p>
        右上の「×」ボタン、またはもう一度ボタンを押すことでポップアップを閉じ、このページに戻ります。
      </p>
      <p>
        <strong>このページはプレビューモードです。</strong>
        決済確認まで進めても、実際の注文・課金・メール送信は一切発生しません。
      </p>
    </main>
    <script>
      (function () {
        // ?scenarioId=xxx を付けて開くと、そのシナリオ専用の内容で確認できる(下書き可)。
        // 未指定の場合は、公開中の先頭シナリオが表示される。どちらの場合もプレビューモード(data-preview="1")で読み込むため、
        // 決済まで進めても実データは作成されない。
        var params = new URLSearchParams(window.location.search);
        var scenarioId = params.get("scenarioId");
        var script = document.createElement("script");
        script.src = "/widget.js";
        if (scenarioId) script.setAttribute("data-scenario-id", scenarioId);
        script.setAttribute("data-preview", "1");
        document.body.appendChild(script);
      })();
    </script>
  </body>
</html>
